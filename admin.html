<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBox - Ultimate Advanced Admin Panel</title>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCdrs9-P25DinXf0RZc0mqQeBiu5Gk4l2M",
            authDomain: "cinebox-9011f.firebaseapp.com",
            projectId: "cinebox-9011f",
            storageBucket: "cinebox-9011f.firebasestorage.app",
            messagingSenderId: "134449166678",
            appId: "1:134449166678:web:6370c97d19b27c48a83ef7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let selectedImageBase64 = "";
        let moviePageAdBase64 = "";

        onAuthStateChanged(auth, (user) => {
            if (user) {
                showDashboard();
            } else {
                handleLogoutUI();
            }
        });

        window.handleLogin = async function() {
            const emailInput = document.getElementById('usernameInput').value;
            const passInput = document.getElementById('passwordInput').value;
            try {
                await signInWithEmailAndPassword(auth, emailInput, passInput);
                showDashboard();
            } catch (error) {
                document.getElementById('errorMsg').innerText = 'Invalid Email or Password!';
            }
        }

        window.handleLogout = async function() {
            await signOut(auth);
            handleLogoutUI();
        }

        function showDashboard() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'block';
            loadAdminMovies();
            loadSettings();
        }

        function handleLogoutUI() {
            document.getElementById('adminDashboard').style.display = 'none';
            document.getElementById('loginSection').style.display = 'flex';
        }

        let cachedMovies = [];

        window.loadAdminMovies = async function() {
            const list = document.getElementById('adminMovieList');
            list.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#b3b3b3;">Loading...</td></tr>`;
            try {
                const querySnapshot = await getDocs(collection(db, "movies"));
                cachedMovies = [];
                querySnapshot.forEach((docSnap) => {
                    cachedMovies.push({ id: docSnap.id, ...docSnap.data() });
                });

                if (cachedMovies.length === 0) {
                    list.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#b3b3b3;">No movies added yet.</td></tr>`;
                    return;
                }

                list.innerHTML = cachedMovies.map((movie) => `
                    <tr>
                        <td>${movie.title}</td>
                        <td>${movie.category}</td>
                        <td class="action-btns">
                            <button class="edit-btn" onclick="editMovie('${movie.id}')">Edit</button>
                            <button class="delete-btn" onclick="deleteMovie('${movie.id}')">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                list.innerHTML = `<tr><td colspan="3" style="text-align:center; color:red;">Error loading movies.</td></tr>`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const fileInput = document.getElementById('moviePosterFile');
            if(fileInput) {
                fileInput.addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(uploadEvent) {
                            selectedImageBase64 = uploadEvent.target.result;
                        };
                        reader.readAsDataURL(file);
                    }
                });
            }

            const adFileInput = document.getElementById('moviePageAdFile');
            if(adFileInput) {
                adFileInput.addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(uploadEvent) {
                            moviePageAdBase64 = uploadEvent.target.result;
                        };
                        reader.readAsDataURL(file);
                    }
                });
            }
        });

        window.saveMovie = async function() {
            const id = document.getElementById('editMovieId').value;
            const title = document.getElementById('movieTitle').value;
            const category = document.getElementById('movieCategory').value;
            const description = document.getElementById('movieDesc').value;
            const year = document.getElementById('movieYear').value;
            const language = document.getElementById('movieLang').value;
            const duration = document.getElementById('movieDuration').value;
            const cast = document.getElementById('movieCast').value;
            const posterUrlInput = document.getElementById('moviePosterUrl').value;
            let poster = document.getElementById('existingPoster').value;

            if (selectedImageBase64) {
                poster = selectedImageBase64;
            } else if (posterUrlInput) {
                poster = posterUrlInput;
            }

            if (!title || !poster) {
                alert('Please fill Title and Poster!');
                return;
            }

            const qualities = [];
            const l480 = document.getElementById('link480p').value;
            const s480 = document.getElementById('size480p').value;
            if (l480) qualities.push({ quality: '480p', link: l480, size: s480 || '' });

            const l720 = document.getElementById('link720p').value;
            const s720 = document.getElementById('size720p').value;
            if (l720) qualities.push({ quality: '720p', link: l720, size: s720 || '' });

            const l1080 = document.getElementById('link1080p').value;
            const s1080 = document.getElementById('size1080p').value;
            if (l1080) qualities.push({ quality: '1080p', link: l1080, size: s1080 || '' });

            try {
                const movieData = { 
                    title, category, description, year, language, duration, cast, poster, 
                    qualities: qualities, 
                    createdAt: Date.now() 
                };

                if (id === "") {
                    await addDoc(collection(db, "movies"), movieData);
                    alert('Movie added successfully!');
                } else {
                    await updateDoc(doc(db, "movies", id), movieData);
                    document.getElementById('editMovieId').value = "";
                    document.getElementById('formTitle').innerText = "Add New Movie";
                    document.getElementById('saveMovieBtn').innerText = "Add Movie";
                    alert('Movie updated successfully!');
                }
                clearForm();
                loadAdminMovies();
            } catch (error) {
                alert("Failed to save movie.");
            }
        }

        window.editMovie = function(id) {
            const movie = cachedMovies.find(m => m.id === id);
            if (!movie) return;

            document.getElementById('editMovieId').value = movie.id;
            document.getElementById('movieTitle').value = movie.title;
            document.getElementById('movieCategory').value = movie.category;
            document.getElementById('movieDesc').value = movie.description || '';
            document.getElementById('movieYear').value = movie.year || '';
            document.getElementById('movieLang').value = movie.language || '';
            document.getElementById('movieDuration').value = movie.duration || '';
            document.getElementById('movieCast').value = movie.cast || '';
            document.getElementById('existingPoster').value = movie.poster || '';
            
            document.getElementById('link480p').value = ''; document.getElementById('size480p').value = '';
            document.getElementById('link720p').value = ''; document.getElementById('size720p').value = '';
            document.getElementById('link1080p').value = ''; document.getElementById('size1080p').value = '';

            if (movie.qualities && Array.isArray(movie.qualities)) {
                movie.qualities.forEach(q => {
                    if (q.quality === '480p') {
                        document.getElementById('link480p').value = q.link || '';
                        document.getElementById('size480p').value = q.size || '';
                    }
                    if (q.quality === '720p') {
                        document.getElementById('link720p').value = q.link || '';
                        document.getElementById('size720p').value = q.size || '';
                    }
                    if (q.quality === '1080p') {
                        document.getElementById('link1080p').value = q.link || '';
                        document.getElementById('size1080p').value = q.size || '';
                    }
                });
            }

            selectedImageBase64 = "";
            document.getElementById('formTitle').innerText = "Edit Movie";
            document.getElementById('saveMovieBtn').innerText = "Update Movie";
        }

        window.deleteMovie = async function(id) {
            if (confirm('Are you sure you want to delete this movie?')) {
                try {
                    await deleteDoc(doc(db, "movies", id));
                    loadAdminMovies();
                    alert('Movie deleted successfully!');
                } catch (error) {
                    alert("Failed to delete movie.");
                }
            }
        }

        function clearForm() {
            document.getElementById('movieTitle').value = '';
            document.getElementById('movieDesc').value = '';
            document.getElementById('movieYear').value = '';
            document.getElementById('movieLang').value = '';
            document.getElementById('movieDuration').value = '';
            document.getElementById('movieCast').value = '';
            document.getElementById('moviePosterFile').value = '';
            document.getElementById('moviePosterUrl').value = '';
            document.getElementById('existingPoster').value = '';
            document.getElementById('link480p').value = ''; document.getElementById('size480p').value = '';
            document.getElementById('link720p').value = ''; document.getElementById('size720p').value = '';
            document.getElementById('link1080p').value = ''; document.getElementById('size1080p').value = '';
            selectedImageBase64 = "";
        }

        window.saveSiteSettings = async function() {
            const siteTitle = document.getElementById('siteTitleInput').value;
            const themeColor = document.getElementById('themeColorPicker').value;
            const iconUrl = document.getElementById('siteIconInput').value;
            const footerText = document.getElementById('footerTextInput').value;
            const fontStyle = document.getElementById('fontStyleSelect').value;

            try {
                await setDoc(doc(db, "settings", "general"), { siteTitle, themeColor, iconUrl, footerText, fontStyle });
                alert('Website customization saved successfully!');
            } catch (e) {
                alert('Failed to save settings.');
            }
        }

        window.saveAdsSettings = async function() {
            const adsData = {
                topAdImg: document.getElementById('topAdImg').value,
                topAdLink: document.getElementById('topAdLink').value,
                topAdEnable: document.getElementById('topAdEnable').checked,

                middleAdImg: document.getElementById('middleAdImg').value,
                middleAdLink: document.getElementById('middleAdLink').value,
                middleAdEnable: document.getElementById('middleAdEnable').checked,

                bottomAdImg: document.getElementById('bottomAdImg').value,
                bottomAdLink: document.getElementById('bottomAdLink').value,
                bottomAdEnable: document.getElementById('bottomAdEnable').checked
            };

            try {
                await setDoc(doc(db, "settings", "ads"), adsData);
                alert('Advertisement banners saved successfully!');
            } catch (e) {
                alert('Failed to save ads.');
            }
        };

        window.saveMoviePageAd = async function() {
            let adImg = document.getElementById('existingMoviePageAd').value;
            const adUrlInput = document.getElementById('moviePageAdUrl').value;
            const adLink = document.getElementById('moviePageAdLink').value;
            const adEnable = document.getElementById('moviePageAdEnable').checked;

            if (moviePageAdBase64) {
                adImg = moviePageAdBase64;
            } else if (adUrlInput) {
                adImg = adUrlInput;
            }

            const moviePageAdData = {
                adImg: adImg,
                adLink: adLink,
                adEnable: adEnable
            };

            try {
                await setDoc(doc(db, "settings", "moviePageAd"), moviePageAdData);
                alert('Movie Page Advertisement saved successfully!');
            } catch (e) {
                alert('Failed to save movie page ad.');
            }
        };

        async function loadSettings() {
            try {
                const genDoc = await getDoc(doc(db, "settings", "general"));
                if (genDoc.exists()) {
                    const data = genDoc.data();
                    document.getElementById('siteTitleInput').value = data.siteTitle || 'CineBox';
                    document.getElementById('themeColorPicker').value = data.themeColor || '#e50914';
                    document.getElementById('siteIconInput').value = data.iconUrl || '';
                    document.getElementById('footerTextInput').value = data.footerText || '© 2026 CineBox. All Rights Reserved.';
                    document.getElementById('fontStyleSelect').value = data.fontStyle || 'Segoe UI';
                }

                const adDoc = await getDoc(doc(db, "settings", "ads"));
                if (adDoc.exists()) {
                    const data = adDoc.data();
                    document.getElementById('topAdImg').value = data.topAdImg || '';
                    document.getElementById('topAdLink').value = data.topAdLink || '';
                    document.getElementById('topAdEnable').checked = data.topAdEnable || false;

                    document.getElementById('middleAdImg').value = data.middleAdImg || '';
                    document.getElementById('middleAdLink').value = data.middleAdLink || '';
                    document.getElementById('middleAdEnable').checked = data.middleAdEnable || false;

                    document.getElementById('bottomAdImg').value = data.bottomAdImg || '';
                    document.getElementById('bottomAdLink').value = data.bottomAdLink || '';
                    document.getElementById('bottomAdEnable').checked = data.bottomAdEnable || false;
                }

                const movieAdDoc = await getDoc(doc(db, "settings", "moviePageAd"));
                if (movieAdDoc.exists()) {
                    const data = movieAdDoc.data();
                    document.getElementById('existingMoviePageAd').value = data.adImg || '';
                    document.getElementById('moviePageAdUrl').value = data.adImg && data.adImg.startsWith('http') ? data.adImg : '';
                    document.getElementById('moviePageAdLink').value = data.adLink || '';
                    document.getElementById('moviePageAdEnable').checked = data.adEnable || false;
                }
            } catch (e) {}
        }
    </script>

    <style>
        :root {
            --primary-color: #e50914;
            --bg-color: #141414;
            --card-bg: #1f1f1f;
            --text-color: #ffffff;
            --text-muted: #b3b3b3;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; }
        #loginSection { display: flex; align-items: center; justify-content: center; height: 100vh; background: linear-gradient(135deg, #111, #222); padding: 20px; }
        .login-card { background-color: var(--card-bg); padding: 30px; border-radius: 8px; width: 100%; max-width: 380px; border: 1px solid #333; }
        .login-card h2 { margin-bottom: 20px; color: var(--primary-color); text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-muted); }
        .form-control { width: 100%; padding: 10px; background-color: #2a2a2a; border: 1px solid #444; border-radius: 5px; color: white; font-size: 14px; outline: none; }
        .form-control:focus { border-color: var(--primary-color); }
        .btn { width: 100%; padding: 10px; background-color: var(--primary-color); color: white; border: none; border-radius: 5px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .error-msg { color: var(--primary-color); text-align: center; margin-top: 10px; font-size: 13px; }
        #adminDashboard { display: none; padding: 20px; max-width: 1100px; margin: 0 auto; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #222; padding-bottom: 15px; margin-bottom: 25px; }
        .admin-header h1 { color: var(--primary-color); font-size: 22px; }
        .logout-btn { background-color: #333; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 800px) { .admin-grid { grid-template-columns: 1fr; } }
        .admin-box { background-color: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid #333; margin-bottom: 20px; }
        .admin-box h3 { margin-bottom: 15px; font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 8px; }
        .movie-table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        .movie-table th, .movie-table td { padding: 10px; text-align: left; border-bottom: 1px solid #333; font-size: 13px; }
        .movie-table th { color: var(--text-muted); }
        .action-btns button { padding: 4px 8px; margin-right: 4px; border: none; border-radius: 3px; cursor: pointer; font-size: 11px; }
        .edit-btn { background-color: #3498db; color: white; }
        .delete-btn { background-color: #e74c3c; color: white; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 5px; font-size: 13px; color: var(--text-muted); }
        .quality-row { background: #262626; padding: 10px; border-radius: 5px; margin-bottom: 10px; border: 1px solid #444; }
    </style>
</head>
<body>

    <div id="loginSection">
        <div class="login-card">
            <h2>CineBox Admin</h2>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="usernameInput" class="form-control" placeholder="Admin email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="passwordInput" class="form-control" placeholder="Password">
            </div>
            <button class="btn" onclick="handleLogin()">Login</button>
            <div id="errorMsg" class="error-msg"></div>
        </div>
    </div>

    <div id="adminDashboard">
        <div class="admin-header">
            <h1>CineBox Control Center</h1>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>

        <div class="admin-grid">
            <div>
                <!-- Website Customization -->
                <div class="admin-box">
                    <h3>Website Customization</h3>
                    <div class="form-group">
                        <label>Website Title</label>
                        <input type="text" id="siteTitleInput" class="form-control" placeholder="CineBox">
                    </div>
                    <div class="form-group">
                        <label>Theme Color</label>
                        <input type="color" id="themeColorPicker" class="form-control" value="#e50914" style="height: 38px; padding: 2px; cursor: pointer;">
                    </div>
                    <div class="form-group">
                        <label>Font Style</label>
                        <select id="fontStyleSelect" class="form-control">
                            <option value="Segoe UI">Segoe UI</option>
                            <option value="Roboto">Roboto</option>
                            <option value="Poppins">Poppins</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Favicon URL</label>
                        <input type="text" id="siteIconInput" class="form-control" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label>Footer Text</label>
                        <input type="text" id="footerTextInput" class="form-control" placeholder="© 2026 CineBox">
                    </div>
                    <button class="btn" onclick="saveSiteSettings()">Save Customization</button>
                </div>

                <!-- Dedicated Movie Details Page Top Ad Manager -->
                <div class="admin-box" style="border: 2px dashed #3498db;">
                    <h3 style="color: #3498db;">🎬 Movie Details Page Top Advertisement</h3>
                    <input type="hidden" id="existingMoviePageAd">
                    <div class="form-group">
                        <label>Upload Ad Banner Image File</label>
                        <input type="file" id="moviePageAdFile" class="form-control" accept="image/*" style="padding: 6px;">
                    </div>
                    <div class="form-group">
                        <label>OR Ad Banner Image URL</label>
                        <input type="text" id="moviePageAdUrl" class="form-control" placeholder="https://i.ibb.co/...">
                    </div>
                    <div class="form-group">
                        <label>Ad Target Link (OnClick URL)</label>
                        <input type="text" id="moviePageAdLink" class="form-control" placeholder="https://example.com">
                        <div class="checkbox-group" style="margin-top:6px;">
                            <input type="checkbox" id="moviePageAdEnable"> Enable Movie Page Top Ad
                        </div>
                    </div>
                    <button class="btn" style="background-color: #3498db;" onclick="saveMoviePageAd()">Save Movie Page Ad</button>
                </div>

                <!-- Multi-Ads Section -->
                <div class="admin-box">
                    <h3>Home Page Advertisement Banners</h3>
                    <div class="form-group">
                        <label>Top Ad Image URL</label>
                        <input type="text" id="topAdImg" class="form-control" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label>Top Ad Link</label>
                        <input type="text" id="topAdLink" class="form-control" placeholder="https://...">
                        <div class="checkbox-group" style="margin-top:6px;"><input type="checkbox" id="topAdEnable"> Enable Top Ad</div>
                    </div>
                    <button class="btn" style="margin-top:10px;" onclick="saveAdsSettings()">Save Home Ads</button>
                </div>
            </div>

            <div>
                <!-- Add Movie Section -->
                <div class="admin-box">
                    <h3 id="formTitle">Add New Movie</h3>
                    <input type="hidden" id="editMovieId">
                    <input type="hidden" id="existingPoster">
                    <div class="form-group">
                        <label>Movie Title</label>
                        <input type="text" id="movieTitle" class="form-control" placeholder="Toxic V2">
                    </div>
                    <div class="form-group">
                        <label>Genre</label>
                        <input type="text" id="movieCategory" class="form-control" placeholder="Action, Crime">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="movieDesc" class="form-control" style="height:60px;"></textarea>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <div class="form-group" style="flex:1;"><label>Year</label><input type="text" id="movieYear" class="form-control" placeholder="2026"></div>
                        <div class="form-group" style="flex:1;"><label>Language</label><input type="text" id="movieLang" class="form-control" placeholder="Hindi"></div>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <div class="form-group" style="flex:1;"><label>Duration</label><input type="text" id="movieDuration" class="form-control" placeholder="3h 02min"></div>
                        <div class="form-group" style="flex:1;"><label>Starcast</label><input type="text" id="movieCast" class="form-control" placeholder="Yash, Nayanthara"></div>
                    </div>
                    <div class="form-group">
                        <label>Poster File</label>
                        <input type="file" id="moviePosterFile" class="form-control" accept="image/*" style="padding:6px;">
                    </div>
                    <div class="form-group">
                        <label>OR Poster URL</label>
                        <input type="text" id="moviePosterUrl" class="form-control" placeholder="https://...">
                    </div>

                    <div class="form-group">
                        <label style="font-weight: 600; color: #fff;">Download Links by Quality</label>
                        <div class="quality-row">
                            <input type="text" id="link480p" class="form-control" placeholder="480p Link" style="margin-bottom:4px;">
                            <input type="text" id="size480p" class="form-control" placeholder="480p Size Tag (e.g. 600mb {480p-HQCam})">
                        </div>
                        <div class="quality-row">
                            <input type="text" id="link720p" class="form-control" placeholder="720p Link" style="margin-bottom:4px;">
                            <input type="text" id="size720p" class="form-control" placeholder="Size Tag (e.g. 990mb {720p-HEVC})">
                        </div>
                        <div class="quality-row">
                            <input type="text" id="link1080p" class="form-control" placeholder="1080p Link" style="margin-bottom:4px;">
                            <input type="text" id="size1080p" class="form-control" placeholder="Size Tag (e.g. 3.5Gb {1080p-HQCam})">
                        </div>
                    </div>
                    <button class="btn" id="saveMovieBtn" onclick="saveMovie()">Add Movie</button>
                </div>

                <div class="admin-box">
                    <h3>Manage Movies</h3>
                    <table class="movie-table">
                        <thead><tr><th>Title</th><th>Genre</th><th>Actions</th></tr></thead>
                        <tbody id="adminMovieList"><tr><td colspan="3" style="text-align:center;">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
