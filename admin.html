<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBox - Ultimate Advanced Admin Panel</title>
    <style>
        :root {
            --primary-color: #e50914;
            --bg-color: #141414;
            --card-bg: #1f1f1f;
            --text-color: #ffffff;
            --text-muted: #b3b3b3;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; }
        #loginSection { display: flex; align-items: center; justify-content: center; height: 100vh; background: linear-gradient(135deg, #111, #222); padding: 20px; }
        .login-card { background-color: var(--card-bg); padding: 30px; border-radius: 8px; width: 100%; max-width: 380px; border: 1px solid #333; }
        .login-card h2 { margin-bottom: 20px; color: var(--primary-color); text-align: center; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 13px; color: var(--text-muted); }
        .form-control { width: 100%; padding: 8px 10px; background-color: #2a2a2a; border: 1px solid #444; border-radius: 5px; color: white; font-size: 13px; outline: none; }
        .form-control:focus { border-color: var(--primary-color); }
        .btn { width: 100%; padding: 10px; background-color: var(--primary-color); color: white; border: none; border-radius: 5px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .error-msg { color: var(--primary-color); text-align: center; margin-top: 10px; font-size: 13px; }
        #adminDashboard { display: none; padding: 20px; max-width: 1100px; margin: 0 auto; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #222; padding-bottom: 15px; margin-bottom: 20px; }
        .admin-header h1 { color: var(--primary-color); font-size: 20px; }
        .logout-btn { background-color: #333; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 800px) { .admin-grid { grid-template-columns: 1fr; } }
        .admin-box { background-color: var(--card-bg); padding: 18px; border-radius: 8px; border: 1px solid #333; margin-bottom: 20px; }
        .admin-box h3 { margin-bottom: 12px; font-size: 15px; border-bottom: 1px solid #333; padding-bottom: 6px; }
        .movie-table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        .movie-table th, .movie-table td { padding: 8px; text-align: left; border-bottom: 1px solid #333; font-size: 12px; }
        .movie-table th { color: var(--text-muted); }
        .action-btns button { padding: 4px 8px; margin-right: 4px; border: none; border-radius: 3px; cursor: pointer; font-size: 11px; }
        .edit-btn { background-color: #3498db; color: white; }
        .delete-btn { background-color: #e74c3c; color: white; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 12px; color: var(--text-muted); }
        .quality-row { background: #262626; padding: 8px; border-radius: 5px; margin-bottom: 8px; border: 1px solid #444; }
        .ad-box-sub { background: #262626; padding: 10px; border-radius: 5px; margin-bottom: 10px; border: 1px solid #444; }
    </style>
</head>
<body>

    <div id="loginSection">
        <div class="login-card">
            <h2>CineBox Admin</h2>
            <div class="form-group"><label>Email Address</label><input type="email" id="usernameInput" class="form-control" placeholder="Admin email"></div>
            <div class="form-group"><label>Password</label><input type="password" id="passwordInput" class="form-control" placeholder="Password"></div>
            <button class="btn" onclick="handleLogin()">Login</button>
            <div id="errorMsg" class="error-msg"></div>
        </div>
    </div>

    <div id="adminDashboard">
        <div class="admin-header">
            <h1>CineBox Control Center</h1>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>

        <div class="admin-grid">
            <div>
                <!-- 1. WEBSITE CUSTOMIZATION -->
                <div class="admin-box">
                    <h3>🎨 Website Customization & Header Background</h3>
                    <div class="form-group"><label>Website Title</label><input type="text" id="siteTitleInput" class="form-control" placeholder="CineBox"></div>
                    <div class="form-group"><label>Theme Color</label><input type="color" id="themeColorPicker" class="form-control" value="#e50914" style="height: 35px; padding: 2px; cursor: pointer;"></div>
                    <div class="form-group"><label>Font Style</label>
                        <select id="fontStyleSelect" class="form-control">
                            <option value="Segoe UI">Segoe UI</option><option value="Roboto">Roboto</option><option value="Poppins">Poppins</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Favicon URL</label><input type="text" id="siteIconInput" class="form-control" placeholder="https://..."></div>
                    <div class="form-group"><label>Footer Text</label><input type="text" id="footerTextInput" class="form-control" placeholder="© 2026 CineBox"></div>
                    
                    <div class="ad-box-sub" style="margin-top: 15px; border: 1px dashed var(--primary-color);">
                        <label style="font-weight:600; color:var(--primary-color);">Header Title Background (Image/Video)</label>
                        <input type="hidden" id="existingHeaderMedia">
                        <input type="file" id="headerMediaFile" class="form-control" accept="image/*,video/mp4" style="padding:4px; margin-top:4px;">
                        <input type="text" id="headerMediaUrl" class="form-control" placeholder="OR Media URL (.jpg, .mp4)" style="margin-top:4px;">
                        <div class="checkbox-group" style="margin-top:6px;"><input type="checkbox" id="headerMediaEnable"> Enable Header Background Media</div>
                    </div>

                    <button class="btn" style="margin-top:10px;" onclick="saveSiteSettings()">Save Customization</button>
                </div>

                <!-- 2. ADVANCED ADVERTISEMENT MANAGER -->
                <div class="admin-box" style="border: 1px solid #f39c12;">
                    <h3 style="color: #f39c12;">📢 Advanced Advertisement Manager</h3>
                    <div id="adsManagerContainer">
                        <script>
                            const adSlots = [
                                { id: 'top', label: 'Home: Top Ad' },
                                { id: 'middle', label: 'Home: Middle Ad' },
                                { id: 'bottom', label: 'Home: Bottom Ad' },
                                { id: 'movieTop', label: 'Movie Page: Top Ad' },
                                { id: 'movieMid', label: 'Movie Page: Middle Ad' },
                                { id: 'movieBot', label: 'Movie Page: Bottom Ad' }
                            ];
                            document.write(adSlots.map(s => `
                                <div class="ad-box-sub">
                                    <label style="font-weight:600; color:#fff;">${s.label} (Image/Video)</label>
                                    <input type="hidden" id="existingAd_${s.id}">
                                    <input type="file" id="adFile_${s.id}" class="form-control" accept="image/*,video/mp4" style="padding:4px; margin-top:4px;">
                                    <input type="text" id="adUrl_${s.id}" class="form-control" placeholder="OR Media URL" style="margin-top:4px;">
                                    <input type="text" id="adLink_${s.id}" class="form-control" placeholder="Target Link URL" style="margin-top:4px;">
                                    
                                    <div style="margin-top:6px;">
                                        <label style="font-size:11px; color:#aaa;">Banner Size Preset:</label>
                                        <select id="adSizePreset_${s.id}" class="form-control" onchange="applyPresetSize('${s.id}')" style="margin-top:2px;">
                                            <option value="banner">Standard Banner (728 x 90px)</option>
                                            <option value="youtube">YouTube Video / Thumbnail (16:9)</option>
                                            <option value="square">Square Post (300 x 300px)</option>
                                            <option value="reel">Reels / Shorts (9:16 vertical)</option>
                                            <option value="compact">Compact Small Bar (100% x 50px)</option>
                                            <option value="custom">Custom Size</option>
                                        </select>
                                    </div>

                                    <div id="customSizeBox_${s.id}" style="display:flex; gap:5px; margin-top:6px;">
                                        <input type="text" id="adHeight_${s.id}" class="form-control" placeholder="Height">
                                        <input type="text" id="adWidth_${s.id}" class="form-control" placeholder="Width">
                                    </div>

                                    <div class="checkbox-group" style="margin-top:6px;"><input type="checkbox" id="adEnable_${s.id}"> Enable Ad</div>
                                </div>
                            `).join(''));
                        </script>
                    </div>
                    <button class="btn" style="background-color: #f39c12; color: #000; font-weight:700; margin-top:10px;" onclick="saveAllAdsSettings()">Save All Advertisements</button>
                </div>
            </div>

            <div>
                <!-- 3. MOVIE MANAGEMENT -->
                <div class="admin-box" style="border: 1px solid var(--primary-color);">
                    <h3 id="formTitle" style="color: var(--primary-color);">Add New Movie</h3>
                    <input type="hidden" id="editMovieId">
                    <input type="hidden" id="existingPoster">
                    
                    <div class="form-group"><label>Movie Title</label><input type="text" id="movieTitle" class="form-control" placeholder="Toxic V2"></div>
                    <div class="form-group"><label>Genre / Category</label><input type="text" id="movieCategory" class="form-control" placeholder="Action, Crime, Drama"></div>
                    <div class="form-group"><label>Description</label><textarea id="movieDesc" class="form-control" placeholder="Summary..." style="height:60px;"></textarea></div>
                    <div style="display: flex; gap: 10px;">
                        <div class="form-group" style="flex:1;"><label>Release Year</label><input type="text" id="movieYear" class="form-control" placeholder="2026"></div>
                        <div class="form-group" style="flex:1;"><label>Language</label><input type="text" id="movieLang" class="form-control" placeholder="Hindi"></div>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <div class="form-group" style="flex:1;"><label>Duration</label><input type="text" id="movieDuration" class="form-control" placeholder="3h 02min"></div>
                        <div class="form-group" style="flex:1;"><label>Starcast</label><input type="text" id="movieCast" class="form-control" placeholder="Yash, Nayanthara"></div>
                    </div>
                    <div class="form-group"><label>Poster File</label><input type="file" id="moviePosterFile" class="form-control" accept="image/*" style="padding:4px;"></div>
                    <div class="form-group"><label>OR Poster URL</label><input type="text" id="moviePosterUrl" class="form-control" placeholder="https://..."></div>

                    <div class="form-group">
                        <label style="font-weight: 600; color: #fff;">Download Links & Quality Setup</label>
                        <div class="quality-row">
                            <input type="text" id="link480p" class="form-control" placeholder="480p Link" style="margin-bottom:4px;">
                            <input type="text" id="size480p" class="form-control" placeholder="Size Tag (e.g. 600mb {480p-HQCam})">
                        </div>
                        <div class="quality-row">
                            <input type="text" id="link720p" class="form-control" placeholder="720p Link" style="margin-bottom:4px;">
                            <input type="text" id="size720p" class="form-control" placeholder="Size Tag (e.g. 990mb {720p-HEVC})">
                        </div>
                        <div class="quality-row">
                            <input type="text" id="link1080p" class="form-control" placeholder="1080p Link" style="margin-bottom:4px;">
                            <input type="text" id="size1080p" class="form-control" placeholder="Size Tag (e.g. 3.5Gb {1080p-HQCam})">
                        </div>
                    </div>
                    <button class="btn" id="saveMovieBtn" onclick="saveMovie()">Add Movie</button>
                </div>

                <div class="admin-box">
                    <h3>Manage Movies Database</h3>
                    <div class="form-group" style="margin-bottom: 10px;">
                        <input type="text" id="adminSearchInput" class="form-control" placeholder="🔍 Search movie by title or date..." oninput="filterAdminMovies()">
                    </div>
                    <div style="overflow-x: auto; max-height: 250px;">
                        <table class="movie-table">
                            <thead><tr><th>Title</th><th>Date / Time</th><th>Actions</th></tr></thead>
                            <tbody id="adminMovieList"><tr><td colspan="3" style="text-align:center;">Loading...</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
        <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCdrs9-P25DinXf0RZc0mqQeBiu5Gk4l2M",
            authDomain: "cinebox-9011f.firebaseapp.com",
            projectId: "cinebox-9011f",
            storageBucket: "cinebox-9011f.firebasestorage.app",
            messagingSenderId: "134449166678",
            appId: "1:134449166678:web:6370c97d19b27c48a83ef7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let selectedImageBase64 = "";
        let headerMediaBase64 = "";
        let adBase64Map = {};

        onAuthStateChanged(auth, (user) => {
            if (user) { showDashboard(); } else { handleLogoutUI(); }
        });

        window.handleLogin = async function() {
            const emailInput = document.getElementById('usernameInput').value;
            const passInput = document.getElementById('passwordInput').value;
            try {
                await signInWithEmailAndPassword(auth, emailInput, passInput);
                showDashboard();
            } catch (error) { document.getElementById('errorMsg').innerText = 'Invalid Email or Password!'; }
        }

        window.handleLogout = async function() { await signOut(auth); handleLogoutUI(); }

        function showDashboard() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'block';
            loadAdminMovies();
            loadSettings();
        }

        function handleLogoutUI() {
            document.getElementById('adminDashboard').style.display = 'none';
            document.getElementById('loginSection').style.display = 'flex';
        }

        let cachedMovies = [];

        window.loadAdminMovies = async function() {
            const list = document.getElementById('adminMovieList');
            list.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#b3b3b3;">Loading...</td></tr>`;
            try {
                const querySnapshot = await getDocs(collection(db, "movies"));
                cachedMovies = [];
                querySnapshot.forEach((docSnap) => {
                    cachedMovies.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderAdminMovieList(cachedMovies);
            } catch (err) {
                list.innerHTML = `<tr><td colspan="3" style="text-align:center; color:red;">Error loading movies.</td></tr>`;
            }
        }

        function renderAdminMovieList(movies) {
            const list = document.getElementById('adminMovieList');
            if (movies.length === 0) {
                list.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#b3b3b3;">No movies found.</td></tr>`;
                return;
            }
            movies.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

            list.innerHTML = movies.map((movie) => {
                const dateStr = movie.createdAt ? new Date(movie.createdAt).toLocaleString() : 'N/A';
                return `
                    <tr>
                        <td><b>${movie.title}</b><br><small style="color:#888;">${movie.category || ''}</small></td>
                        <td><small>${dateStr}</small></td>
                        <td class="action-btns">
                            <button class="edit-btn" onclick="editMovie('${movie.id}')">Edit</button>
                            <button class="delete-btn" onclick="deleteMovie('${movie.id}')">Del</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        window.filterAdminMovies = function() {
            const query = document.getElementById('adminSearchInput').value.toLowerCase();
            const filtered = cachedMovies.filter(m => 
                (m.title && m.title.toLowerCase().includes(query)) || 
                (m.category && m.category.toLowerCase().includes(query)) ||
                (m.createdAt && new Date(m.createdAt).toLocaleString().toLowerCase().includes(query))
            );
            renderAdminMovieList(filtered);
        }

        document.addEventListener('DOMContentLoaded', () => {
            setupFileReader('moviePosterFile', (res) => { selectedImageBase64 = res; });
            setupFileReader('headerMediaFile', (res) => { headerMediaBase64 = res; });
            const adKeys = ['top', 'middle', 'bottom', 'movieTop', 'movieMid', 'movieBot'];
            adKeys.forEach(key => {
                setupFileReader(`adFile_${key}`, (res) => { adBase64Map[key] = res; });
            });
        });

        function setupFileReader(elementId, callback) {
            const el = document.getElementById(elementId);
            if (el) {
                el.addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(evt) { callback(evt.target.result); };
                        reader.readAsDataURL(file);
                    }
                });
            }
        }

        window.applyPresetSize = function(id) {
            const preset = document.getElementById(`adSizePreset_${id}`).value;
            const hField = document.getElementById(`adHeight_${id}`);
            const wField = document.getElementById(`adWidth_${id}`);

            if (preset === 'banner') { hField.value = '90px'; wField.value = '100%'; }
            else if (preset === 'youtube') { hField.value = '180px'; wField.value = '100%'; }
            else if (preset === 'square') { hField.value = '250px'; wField.value = '250px'; }
            else if (preset === 'reel') { hField.value = '320px'; wField.value = '180px'; }
            else if (preset === 'compact') { hField.value = '50px'; wField.value = '100%'; }
        }

        window.saveMovie = async function() {
            const id = document.getElementById('editMovieId').value;
            const title = document.getElementById('movieTitle').value;
            const category = document.getElementById('movieCategory').value;
            const description = document.getElementById('movieDesc').value;
            const year = document.getElementById('movieYear').value;
            const language = document.getElementById('movieLang').value;
            const duration = document.getElementById('movieDuration').value;
            const cast = document.getElementById('movieCast').value;
            const posterUrlInput = document.getElementById('moviePosterUrl').value;
            let poster = document.getElementById('existingPoster').value;

            if (selectedImageBase64) { poster = selectedImageBase64; } 
            else if (posterUrlInput) { poster = posterUrlInput; }

            if (!title || !poster) { alert('Please fill Title and Poster!'); return; }

            const qualities = [];
            ['480p', '720p', '1080p'].forEach(q => {
                const link = document.getElementById(`link${q}`).value;
                const size = document.getElementById(`size${q}`).value;
                if (link) qualities.push({ quality: q, link, size: size || '' });
            });

            try {
                const movieData = { 
                    title, category, description, year, language, duration, cast, poster, 
                    qualities, createdAt: id === "" ? Date.now() : (cachedMovies.find(m => m.id === id)?.createdAt || Date.now())
                };

                if (id === "") {
                    await addDoc(collection(db, "movies"), movieData);
                    alert('Movie added successfully!');
                } else {
                    await updateDoc(doc(db, "movies", id), movieData);
                    document.getElementById('editMovieId').value = "";
                    document.getElementById('formTitle').innerText = "Add New Movie";
                    document.getElementById('saveMovieBtn').innerText = "Add Movie";
                    alert('Movie updated successfully!');
                }
                clearForm();
                loadAdminMovies();
            } catch (error) { alert("Failed to save movie."); }
        }

        window.editMovie = function(id) {
            const movie = cachedMovies.find(m => m.id === id);
            if (!movie) return;

            document.getElementById('editMovieId').value = movie.id;
            document.getElementById('movieTitle').value = movie.title;
            document.getElementById('movieCategory').value = movie.category;
            document.getElementById('movieDesc').value = movie.description || '';
            document.getElementById('movieYear').value = movie.year || '';
            document.getElementById('movieLang').value = movie.language || '';
            document.getElementById('movieDuration').value = movie.duration || '';
            document.getElementById('movieCast').value = movie.cast || '';
            document.getElementById('existingPoster').value = movie.poster || '';
            
            ['480p', '720p', '1080p'].forEach(q => {
                document.getElementById(`link${q}`).value = '';
                document.getElementById(`size${q}`).value = '';
            });

            if (movie.qualities && Array.isArray(movie.qualities)) {
                movie.qualities.forEach(q => {
                    if (document.getElementById(`link${q.quality}`)) {
                        document.getElementById(`link${q.quality}`).value = q.link || '';
                        document.getElementById(`size${q.quality}`).value = q.size || '';
                    }
                });
            }

            selectedImageBase64 = "";
            document.getElementById('formTitle').innerText = "Edit Movie";
            document.getElementById('saveMovieBtn').innerText = "Update Movie";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.deleteMovie = async function(id) {
            if (confirm('Are you sure you want to delete this movie?')) {
                try {
                    await deleteDoc(doc(db, "movies", id));
                    loadAdminMovies();
                    alert('Movie deleted successfully!');
                } catch (error) { alert("Failed to delete movie."); }
            }
        }

        function clearForm() {
            document.getElementById('movieTitle').value = '';
            document.getElementById('movieDesc').value = '';
            document.getElementById('movieYear').value = '';
            document.getElementById('movieLang').value = '';
            document.getElementById('movieDuration').value = '';
            document.getElementById('movieCast').value = '';
            document.getElementById('moviePosterFile').value = '';
            document.getElementById('moviePosterUrl').value = '';
            document.getElementById('existingPoster').value = '';
            ['480p', '720p', '1080p'].forEach(q => {
                document.getElementById(`link${q}`).value = '';
                document.getElementById(`size${q}`).value = '';
            });
            selectedImageBase64 = "";
        }

        window.saveAllAdsSettings = async function() {
            const adKeys = ['top', 'middle', 'bottom', 'movieTop', 'movieMid', 'movieBot'];
            const adsData = {};

            adKeys.forEach(key => {
                let media = document.getElementById(`existingAd_${key}`)?.value || '';
                const url = document.getElementById(`adUrl_${key}`).value;
                if (adBase64Map[key]) { media = adBase64Map[key]; } 
                else if (url) { media = url; }

                adsData[`${key}Media`] = media;
                adsData[`${key}Link`] = document.getElementById(`adLink_${key}`).value;
                adsData[`${key}Preset`] = document.getElementById(`adSizePreset_${key}`).value;
                adsData[`${key}Height`] = document.getElementById(`adHeight_${key}`).value;
                adsData[`${key}Width`] = document.getElementById(`adWidth_${key}`).value;
                adsData[`${key}Enable`] = document.getElementById(`adEnable_${key}`).checked;
            });

            try {
                await setDoc(doc(db, "settings", "advancedAds"), adsData);
                alert('All Advertisements saved successfully!');
            } catch (e) { alert('Failed to save advertisements.'); }
        };

        window.saveSiteSettings = async function() {
            const siteTitle = document.getElementById('siteTitleInput').value;
            const themeColor = document.getElementById('themeColorPicker').value;
            const iconUrl = document.getElementById('siteIconInput').value;
            const footerText = document.getElementById('footerTextInput').value;
            const fontStyle = document.getElementById('fontStyleSelect').value;

            let headerMedia = document.getElementById('existingHeaderMedia').value;
            const headerMediaUrl = document.getElementById('headerMediaUrl').value;
            if (headerMediaBase64) { headerMedia = headerMediaBase64; }
            else if (headerMediaUrl) { headerMedia = headerMediaUrl; }

            const generalData = {
                siteTitle, themeColor, iconUrl, footerText, fontStyle,
                headerMedia,
                headerMediaEnable: document.getElementById('headerMediaEnable').checked
            };

            try {
                await setDoc(doc(db, "settings", "general"), generalData);
                alert('Website Customization & Header saved successfully!');
            } catch (e) { alert('Failed to save settings.'); }
        }

        async function loadSettings() {
            try {
                const genDoc = await getDoc(doc(db, "settings", "general"));
                if (genDoc.exists()) {
                    const data = genDoc.data();
                    document.getElementById('siteTitleInput').value = data.siteTitle || 'CineBox';
                    document.getElementById('themeColorPicker').value = data.themeColor || '#e50914';
                    document.getElementById('siteIconInput').value = data.iconUrl || '';
                    document.getElementById('footerTextInput').value = data.footerText || '© 2026 CineBox. All Rights Reserved.';
                    document.getElementById('fontStyleSelect').value = data.fontStyle || 'Segoe UI';

                    document.getElementById('existingHeaderMedia').value = data.headerMedia || '';
                    document.getElementById('headerMediaUrl').value = (data.headerMedia && data.headerMedia.startsWith('http')) ? data.headerMedia : '';
                    document.getElementById('headerMediaEnable').checked = data.headerMediaEnable || false;
                }

                const adDoc = await getDoc(doc(db, "settings", "advancedAds"));
                if (adDoc.exists()) {
                    const data = adDoc.data();
                    const adKeys = ['top', 'middle', 'bottom', 'movieTop', 'movieMid', 'movieBot'];
                    adKeys.forEach(key => {
                        const hiddenField = document.getElementById(`existingAd_${key}`);
                        if (hiddenField) hiddenField.value = data[`${key}Media`] || '';
                        if (document.getElementById(`adUrl_${key}`)) {
                            document.getElementById(`adUrl_${key}`).value = (data[`${key}Media`] && data[`${key}Media`].startsWith('http')) ? data[`${key}Media`] : '';
                        }
                        if (document.getElementById(`adLink_${key}`)) {
                            document.getElementById(`adLink_${key}`).value = data[`${key}Link`] || '';
                        }
                        if (document.getElementById(`adSizePreset_${key}`)) {
                            document.getElementById(`adSizePreset_${key}`).value = data[`${key}Preset`] || 'banner';
                        }
                        if (document.getElementById(`adHeight_${key}`)) {
                            document.getElementById(`adHeight_${key}`).value = data[`${key}Height`] || '90px';
                        }
                        if (document.getElementById(`adWidth_${key}`)) {
                            document.getElementById(`adWidth_${key}`).value = data[`${key}Width`] || '100%';
                        }
                        if (document.getElementById(`adEnable_${key}`)) {
                            document.getElementById(`adEnable_${key}`).checked = data[`${key}Enable`] || false;
                        }
                    });
                }
            } catch (e) {}
        }
    </script>
</body>
</html>
