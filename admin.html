<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBox - Admin Panel</title>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // TODO: Replace with your actual Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCdrs9-P25DinXf0RZc0mqQeBiu5Gk4l2M",
            authDomain: "cinebox-9011f.firebaseapp.com",
            projectId: "cinebox-9011f",
            storageBucket: "cinebox-9011f.firebasestorage.app",
            messagingSenderId: "134449166678",
            appId: "1:134449166678:web:6370c97d19b27c48a83ef7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Check active session automatically
        onAuthStateChanged(auth, (user) => {
            if (user) {
                showDashboard();
            } else {
                handleLogoutUI();
            }
        });

        window.handleLogin = async function() {
            const emailInput = document.getElementById('usernameInput').value; // Yahan apna Firebase wala Email dalein
            const passInput = document.getElementById('passwordInput').value; // Yahan Password dalein
            
            try {
                // Firebase Auth se sign in karein
                await signInWithEmailAndPassword(auth, emailInput, passInput);
                showDashboard();
            } catch (error) {
                console.error(error);
                document.getElementById('errorMsg').innerText = 'Invalid Email or Password!';
            }
        }

        window.handleLogout = async function() {
            try {
                await signOut(auth);
                handleLogoutUI();
            } catch (error) {
                console.error(error);
            }
        }

        function showDashboard() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'block';
            loadAdminMovies();
            
            const savedColor = localStorage.getItem('cinebox_theme_color');
            if(savedColor) {
                document.getElementById('themeColorPicker').value = savedColor;
                document.documentElement.style.setProperty('--primary-color', savedColor);
            }
        }

        function handleLogoutUI() {
            document.getElementById('adminDashboard').style.display = 'none';
            document.getElementById('loginSection').style.display = 'flex';
        }

        let cachedMovies = [];

        window.loadAdminMovies = async function() {
            const list = document.getElementById('adminMovieList');
            list.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#b3b3b3;">Loading...</td></tr>`;
            try {
                const querySnapshot = await getDocs(collection(db, "movies"));
                cachedMovies = [];
                querySnapshot.forEach((documentSnapshot) => {
                    cachedMovies.push({ id: documentSnapshot.id, ...documentSnapshot.data() });
                });

                if (cachedMovies.length === 0) {
                    list.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#b3b3b3;">No movies added yet.</td></tr>`;
                    return;
                }

                list.innerHTML = cachedMovies.map((movie) => `
                    <tr>
                        <td>${movie.title}</td>
                        <td>${movie.category}</td>
                        <td class="action-btns">
                            <button class="edit-btn" onclick="editMovie('${movie.id}')">Edit</button>
                            <button class="delete-btn" onclick="deleteMovie('${movie.id}')">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
                list.innerHTML = `<tr><td colspan="3" style="text-align:center; color:red;">Error loading movies.</td></tr>`;
            }
        }

        window.saveMovie = async function() {
            const id = document.getElementById('editMovieId').value;
            const title = document.getElementById('movieTitle').value;
            const category = document.getElementById('movieCategory').value;
            const poster = document.getElementById('moviePoster').value;
            const link = document.getElementById('movieLink').value;

            if (!title || !poster || !link) {
                alert('Please fill all fields!');
                return;
            }

            try {
                if (id === "") {
                    // Add new movie to Firestore
                    await addDoc(collection(db, "movies"), { title, category, poster, link, createdAt: Date.now() });
                    alert('Movie added successfully!');
                } else {
                    // Update existing movie in Firestore
                    const movieRef = doc(db, "movies", id);
                    await updateDoc(movieRef, { title, category, poster, link });
                    document.getElementById('editMovieId').value = "";
                    document.getElementById('formTitle').innerText = "Add New Movie";
                    document.getElementById('saveMovieBtn').innerText = "Add Movie";
                    alert('Movie updated successfully!');
                }

                clearForm();
                loadAdminMovies();
            } catch (error) {
                console.error("Error saving movie: ", error);
                alert("Failed to save movie.");
            }
        }

        window.editMovie = function(id) {
            const movie = cachedMovies.find(m => m.id === id);
            if (!movie) return;

            document.getElementById('editMovieId').value = movie.id;
            document.getElementById('movieTitle').value = movie.title;
            document.getElementById('movieCategory').value = movie.category;
            document.getElementById('moviePoster').value = movie.poster;
            document.getElementById('movieLink').value = movie.link;

            document.getElementById('formTitle').innerText = "Edit Movie";
            document.getElementById('saveMovieBtn').innerText = "Update Movie";
        }

        window.deleteMovie = async function(id) {
            if (confirm('Are you sure you want to delete this movie?')) {
                try {
                    await deleteDoc(doc(db, "movies", id));
                    loadAdminMovies();
                    alert('Movie deleted successfully!');
                } catch (error) {
                    console.error("Error deleting movie: ", error);
                    alert("Failed to delete movie.");
                }
            }
        }

        function clearForm() {
            document.getElementById('movieTitle').value = '';
            document.getElementById('moviePoster').value = '';
            document.getElementById('movieLink').value = '';
        }

        window.saveTheme = function() {
            const color = document.getElementById('themeColorPicker').value;
            localStorage.setItem('cinebox_theme_color', color);
            document.documentElement.style.setProperty('--primary-color', color);
            alert('Theme color updated successfully!');
        }
    </script>

    <style>
        :root {
            --primary-color: #e50914;
            --bg-color: #141414;
            --card-bg: #1f1f1f;
            --text-color: #ffffff;
            --text-muted: #b3b3b3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
        }

        #loginSection {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #111, #222);
        }

        .login-card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        .login-card h2 {
            margin-bottom: 20px;
            color: var(--primary-color);
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary-color);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .error-msg {
            color: var(--primary-color);
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }

        #adminDashboard {
            display: none;
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #222;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .admin-header h1 {
            color: var(--primary-color);
            font-size: 26px;
        }

        .logout-btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .admin-grid {
                grid-template-columns: 1fr;
            }
        }

        .admin-box {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #333;
            margin-box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 25px;
        }

        .admin-box h3 {
            margin-bottom: 20px;
            font-size: 18px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .movie-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .movie-table th, .movie-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
            font-size: 14px;
        }

        .movie-table th {
            color: var(--text-muted);
        }

        .action-btns button {
            padding: 5px 10px;
            margin-right: 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .edit-btn { background-color: #3498db; color: white; }
        .delete-btn { background-color: #e74c3c; color: white; }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="loginSection">
        <div class="login-card">
            <h2>CineBox Admin</h2>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="usernameInput" class="form-control" placeholder="Enter your Firebase auth email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="passwordInput" class="form-control" placeholder="Enter password">
            </div>
            <button class="btn" onclick="handleLogin()">Login</button>
            <div id="errorMsg" class="error-msg"></div>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard">
        <div class="admin-header">
            <h1>CineBox Control Center</h1>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>

        <div class="admin-grid">
            <!-- Left Column: Add/Edit Movie & Theme Customizer -->
            <div>
                <div class="admin-box">
                    <h3 id="formTitle">Add New Movie</h3>
                    <input type="hidden" id="editMovieId">
                    <div class="form-group">
                        <label>Movie Title</label>
                        <input type="text" id="movieTitle" class="form-control" placeholder="e.g. Avatar 2">
                    </div>
                    <div class="form-group">
                        <label>Category / Genre</label>
                        <select id="movieCategory" class="form-control">
                            <option value="Action">Action</option>
                            <option value="Comedy">Comedy</option>
                            <option value="Horror">Horror</option>
                            <option value="Romance">Romance</option>
                            <option value="Sci-Fi">Sci-Fi</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Poster Image Link</label>
                        <input type="text" id="moviePoster" class="form-control" placeholder="https://example.com/poster.jpg">
                    </div>
                    <div class="form-group">
                        <label>Download Link</label>
                        <input type="text" id="movieLink" class="form-control" placeholder="https://example.com/download">
                    </div>
                    <button class="btn" id="saveMovieBtn" onclick="saveMovie()">Add Movie</button>
                </div>

                <div class="admin-box">
                    <h3>Theme Customizer</h3>
                    <div class="form-group">
                        <label>Poster / Accent Theme Color</label>
                        <input type="color" id="themeColorPicker" class="form-control" value="#e50914" style="height: 40px; padding: 2px; cursor: pointer;">
                    </div>
                    <button class="btn" onclick="saveTheme()">Apply Theme</button>
                </div>
            </div>

            <!-- Right Column: Movie Management List -->
            <div>
                <div class="admin-box">
                    <h3>Manage Movies Database</h3>
                    <div style="overflow-x: auto;">
                        <table class="movie-table">
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Category</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="adminMovieList">
                                <!-- Loaded dynamically from Firebase -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
