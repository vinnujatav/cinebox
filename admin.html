<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineBox Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      padding: 20px;
    }

    .box {
      max-width: 500px;
      margin: 40px auto;
      background: #16161f;
      padding: 25px;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0 14px;
      border: 0;
      border-radius: 8px;
      background: #242431;
      color: white;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #e50914;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .logout {
      background: #555;
    }

    #adminPanel {
      display: none;
    }

    #status {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div class="box" id="loginBox">
    <h1>🎬 CineBox Admin</h1>

    <input
      type="email"
      id="email"
      placeholder="Admin Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="login()">Login</button>

    <p id="loginStatus"></p>
  </div>


  <!-- ADMIN PANEL -->
  <div class="box" id="adminPanel">

    <h1>🎬 Add Movie</h1>

    <input
      type="text"
      id="movieName"
      placeholder="Movie Name"
    >

    <input
      type="text"
      id="poster"
      placeholder="Poster Image URL"
    >

    <input
      type="number"
      id="year"
      placeholder="Release Year"
    >

    <select id="genre">
      <option value="Action">Action</option>
      <option value="Comedy">Comedy</option>
      <option value="Drama">Drama</option>
      <option value="Horror">Horror</option>
      <option value="Romance">Romance</option>
      <option value="Animation">Animation</option>
    </select>

    <textarea
      id="description"
      placeholder="Movie Description"
    ></textarea>

    <input
      type="url"
      id="watchUrl"
      placeholder="Authorized Watch URL"
    >

    <input
      type="url"
      id="downloadUrl"
      placeholder="Authorized Download URL"
    >

    <button onclick="addMovie()">➕ Add Movie</button>

    <button class="logout" onclick="logout()">Logout</button>

    <p id="status"></p>

  </div>


  <!-- Firebase -->
  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // ==============================
    // APNA FIREBASE CONFIG YAHAN DALO
    // ==============================

    const firebaseConfig = {
  apiKey: "AIzaSyCdrs9-P25DinXf0RZc0mqQeBiu5Gk4l2M",
  authDomain: "cinebox-9011f.firebaseapp.com",
  projectId: "cinebox-9011f",
  storageBucket: "cinebox-9011f.firebasestorage.app",
  messagingSenderId: "134449166678",
  appId: "1:134449166678:web:6370c97d19b27c48a83ef7"
};


    // Firebase start
    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // LOGIN
    window.login = async function () {

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      const status =
        document.getElementById("loginStatus");

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        document.getElementById("loginBox")
          .style.display = "none";

        document.getElementById("adminPanel")
          .style.display = "block";

      } catch (error) {

        status.innerText =
          "Login failed: " + error.message;

      }

    };


    // ADD MOVIE
    window.addMovie = async function () {

      const status =
        document.getElementById("status");

      try {

        await addDoc(
          collection(db, "movies"),
          {

            name:
              document.getElementById("movieName").value,

            poster:
              document.getElementById("poster").value,

            year:
              document.getElementById("year").value,

            genre:
              document.getElementById("genre").value,

            description:
              document.getElementById("description").value,

            watchUrl:
              document.getElementById("watchUrl").value,

            downloadUrl:
              document.getElementById("downloadUrl").value,

            createdAt:
              serverTimestamp()

          }
        );

        status.innerText =
          "✅ Movie added successfully!";

        document.getElementById("movieName").value = "";
        document.getElementById("poster").value = "";
        document.getElementById("year").value = "";
        document.getElementById("description").value = "";
        document.getElementById("watchUrl").value = "";
        document.getElementById("downloadUrl").value = "";

      } catch (error) {

        status.innerText =
          "❌ Error: " + error.message;

      }

    };


    // LOGOUT
    window.logout = async function () {

      await signOut(auth);

      location.reload();

    };

  </script>

</body>
</html>
