<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CineBox Admin Panel</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#0f1115;
color:#fff;
min-height:100vh;
}

.hidden{
display:none !important;
}

/* LOGIN */

#loginPage{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:#0f1115;
}

.loginBox{
width:100%;
max-width:400px;
background:#181b22;
padding:30px;
border-radius:16px;
box-shadow:0 10px 40px rgba(0,0,0,.5);
}

.loginBox h1{
text-align:center;
margin-bottom:10px;
color:#ff3b30;
}

.loginBox p{
text-align:center;
color:#aaa;
margin-bottom:25px;
}

input,textarea,select{
width:100%;
padding:13px;
margin-top:8px;
margin-bottom:15px;
border:none;
border-radius:8px;
background:#252a33;
color:#fff;
outline:none;
}

textarea{
min-height:100px;
resize:vertical;
}

button{
border:none;
border-radius:8px;
padding:12px 18px;
cursor:pointer;
font-weight:bold;
}

.loginBtn{
width:100%;
background:#e50914;
color:#fff;
font-size:16px;
}

.loginBtn:active{
transform:scale(.98);
}

.status{
margin-top:15px;
padding:10px;
border-radius:8px;
display:none;
font-size:14px;
}

/* ADMIN */

#adminApp{
min-height:100vh;
}

header{
background:#181b22;
padding:15px 20px;
display:flex;
align-items:center;
justify-content:space-between;
position:sticky;
top:0;
z-index:10;
}

header h1{
font-size:22px;
color:#ff3b30;
}

.logoutBtn{
background:#333943;
color:#fff;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.nav{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:25px;
}

.nav button{
background:#252a33;
color:#fff;
}

.nav button.active{
background:#e50914;
}

.section{
display:none;
}

.section.active{
display:block;
}

.card{
background:#181b22;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

.card h2{
margin-bottom:20px;
}

.saveBtn{
background:#e50914;
color:#fff;
}

.cancelBtn{
background:#444;
color:#fff;
margin-left:8px;
}

.movieItem{
background:#252a33;
padding:15px;
border-radius:10px;
margin-bottom:12px;
display:flex;
justify-content:space-between;
gap:15px;
align-items:center;
}

.movieInfo{
flex:1;
}

.movieInfo h3{
margin-bottom:6px;
}

.movieInfo p{
color:#aaa;
font-size:13px;
}

.movieActions{
display:flex;
gap:8px;
}

.editBtn{
background:#1976d2;
color:white;
}

.deleteBtn{
background:#d32f2f;
color:white;
}

@media(max-width:600px){

.movieItem{
flex-direction:column;
align-items:stretch;
}

.movieActions{
width:100%;
}

.movieActions button{
flex:1;
}

}

</style>

</head>

<body>


<!-- LOGIN PAGE -->

<div id="loginPage">

<div class="loginBox">

<h1>🎬 CineBox</h1>

<p>Admin Panel Login</p>

<form id="loginForm">

<label>Email</label>

<input
type="email"
id="email"
placeholder="Admin Email"
required
>

<label>Password</label>

<input
type="password"
id="password"
placeholder="Password"
required
>

<button
type="submit"
class="loginBtn"
id="loginButton"
>
Login
</button>

</form>

<div
id="loginStatus"
class="status"
></div>

</div>

</div>


<!-- ADMIN APP -->

<div
id="adminApp"
class="hidden"
>

<header>

<h1>🎬 CineBox Admin</h1>

<button
class="logoutBtn"
id="logoutButton"
>
Logout
</button>

</header>


<div class="container">


<!-- NAVIGATION -->

<div class="nav">

<button
class="active"
data-section="moviesSection"
>
Movies
</button>

<button
data-section="websiteSection"
>
Website Settings
</button>

<button
data-section="adsSection"
>
Ads Settings
</button>

</div>


<!-- MOVIES -->

<div
id="moviesSection"
class="section active"
>

<div class="card">

<h2>🎬 Add / Edit Movie</h2>

<input
type="hidden"
id="movieId"
>

<label>Movie Name</label>

<input
type="text"
id="movieTitle"
placeholder="Movie name"
>

<label>Poster Image URL</label>

<input
type="url"
id="moviePoster"
placeholder="https://..."
>

<label>Movie Description</label>

<textarea
id="movieDescription"
placeholder="Movie description"
></textarea>

<label>Download Link</label>

<input
type="url"
id="movieDownload"
placeholder="https://..."
>

<label>Category</label>

<select id="movieCategory">

<option value="Bollywood">
Bollywood
</option>

<option value="Hollywood">
Hollywood
</option>

<option value="South">
South
</option>

<option value="Web Series">
Web Series
</option>

</select>

<button
class="saveBtn"
id="saveMovieButton"
>
Save Movie
</button>

<button
class="cancelBtn hidden"
id="cancelMovieButton"
>
Cancel
</button>

<div
id="movieStatus"
class="status"
></div>

</div>


<div class="card">

<h2>📽️ Movies List</h2>

<div id="moviesList">

Loading movies...

</div>

</div>

</div>


<!-- WEBSITE SETTINGS -->

<div
id="websiteSection"
class="section"
>

<div class="card">

<h2>🌐 Website Settings</h2>

<label>Website Name</label>

<input
type="text"
id="siteName"
placeholder="CineBox"
>

<label>Website Description</label>

<textarea
id="siteDescription"
placeholder="Website description"
></textarea>

<label>Notice / Announcement</label>

<textarea
id="siteNotice"
placeholder="Latest announcement..."
></textarea>

<button
class="saveBtn"
id="saveWebsiteButton"
>
Save Website Settings
</button>

<div
id="websiteStatus"
class="status"
></div>

</div>

</div>


<!-- ADS SETTINGS -->

<div
id="adsSection"
class="section"
>

<div class="card">

<h2>📢 Ads Settings</h2>

<label>
Top Image Ad
</label>

<select id="topImageAdEnabled">

<option value="true">
Enabled
</option>

<option value="false">
Disabled
</option>

</select>

<label>
Top Image Ad URL
</label>

<input
type="url"
id="topImageAdUrl"
placeholder="https://..."
>

<button
class="saveBtn"
id="saveAdsButton"
>
Save Ads Settings
</button>

<div
id="adsStatus"
class="status"
></div>

</div>

</div>


</div>

</div>


<!-- FIREBASE -->

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
doc,
getDoc,
updateDoc,
deleteDoc,
setDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

apiKey: "apiKey: "AIzaSyCdrs9-P25DinXf0RZc0mqQeBiu5Gk4l2M",

authDomain: "cinebox-9011f.firebaseapp.com",

projectId: "cinebox-9011f",

storageBucket: "cinebox-9011f.firebasestorage.app",

messagingSenderId: "134449166678",

appId: "1:134449166678:web:6370c97d19b27c48a83ef7"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* ADMIN UID */

const ADMIN_UID =
"tZRY6ChN91Z3AC4HPbkfi78OXOC3";


/* ELEMENTS */

const loginPage =
document.getElementById("loginPage");

const adminApp =
document.getElementById("adminApp");

const loginForm =
document.getElementById("loginForm");

const logoutButton =
document.getElementById("logoutButton");

const loginStatus =
document.getElementById("loginStatus");


/* STATUS FUNCTION */

function showStatus(
id,
message,
success=true
){

const el =
document.getElementById(id);

if(!el) return;

el.textContent =
message;

el.style.display =
"block";

el.style.background =
success
? "#164d2b"
: "#5a1c1c";

}


/* AUTH STATE */

onAuthStateChanged(
auth,
(user)=>{

if(user){

if(user.uid === ADMIN_UID){

loginPage.classList.add("hidden");

adminApp.classList.remove("hidden");

loadMovies();

loadWebsiteSettings();

loadAdsSettings();

}else{

signOut(auth);

showStatus(
"loginStatus",
"❌ You are not authorized as admin.",
false
);

}

}else{

loginPage.classList.remove("hidden");

adminApp.classList.add("hidden");

}

});


/* LOGIN */

loginForm.addEventListener(
"submit",
async (e)=>{

e.preventDefault();

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const button =
document.getElementById("loginButton");

button.disabled =
true;

button.textContent =
"Logging in...";

showStatus(
"loginStatus",
"Logging in...",
true
);

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

}catch(error){

console.error(
"LOGIN ERROR:",
error
);

showStatus(
"loginStatus",
"❌ " + error.message,
false
);

button.disabled =
false;

button.textContent =
"Login";

}

});


/* LOGOUT */

logoutButton.addEventListener(
"click",
async ()=>{

try{

await signOut(auth);

}catch(error){

console.error(error);

}

});


/* NAVIGATION */

document.querySelectorAll(
".nav button"
).forEach(
button=>{

button.addEventListener(
"click",
()=>{

document.querySelectorAll(
".nav button"
).forEach(
b=>b.classList.remove("active")
);

document.querySelectorAll(
".section"
).forEach(
s=>s.classList.remove("active")
);

button.classList.add("active");

document.getElementById(
button.dataset.section
).classList.add("active");

}

);

}
);


/* MOVIES */

const moviesRef =
collection(db,"movies");


async function loadMovies(){

const list =
document.getElementById("moviesList");

list.innerHTML =
"Loading movies...";

try{

const snapshot =
await getDocs(moviesRef);

if(snapshot.empty){

list.innerHTML =
"No movies added yet.";

return;

}

list.innerHTML = "";

snapshot.forEach(
movie=>{

const data =
movie.data();

const div =
document.createElement("div");

div.className =
"movieItem";

div.innerHTML = `

<div class="movieInfo">

<h3>
${escapeHtml(data.title || "Untitled")}
</h3>

<p>
${escapeHtml(data.category || "")}
</p>

</div>

<div class="movieActions">

<button
class="editBtn"
data-id="${movie.id}"
>
Edit
</button>

<button
class="deleteBtn"
data-id="${movie.id}"
>
Delete
</button>

</div>

`;

list.appendChild(div);

});

document.querySelectorAll(
".editBtn"
).forEach(
button=>{

button.addEventListener(
"click",
()=>editMovie(button.dataset.id)
);

});

document.querySelectorAll(
".deleteBtn"
).forEach(
button=>{

button.addEventListener(
"click",
()=>deleteMovie(button.dataset.id)
);

});

}catch(error){

console.error(error);

list.innerHTML =
"❌ Error loading movies: "
+ error.message;

}

}


function escapeHtml(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}
