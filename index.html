<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBox - Movie Download Hub</title>
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // TODO: Replace with your actual Firebase configuration
        const firebaseConfig = {
  apiKey: "AIzaSyCdrs9-P25DinXf0RZc0mqQeBiu5Gk4l2M",
  authDomain: "cinebox-9011f.firebaseapp.com",
  projectId: "cinebox-9011f",
  storageBucket: "cinebox-9011f.firebasestorage.app",
  messagingSenderId: "134449166678",
  appId: "1:134449166678:web:6370c97d19b27c48a83ef7"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Load Theme from Firebase or LocalStorage fallback
        const savedColor = localStorage.getItem('cinebox_theme_color');
        if(savedColor) {
            document.documentElement.style.setProperty('--primary-color', savedColor);
        }

        let allMovies = [];
        let currentCategory = 'All';
        let searchQuery = '';

        async function fetchMoviesFromFirebase() {
            try {
                const querySnapshot = await getDocs(collection(db, "movies"));
                allMovies = [];
                querySnapshot.forEach((doc) => {
                    allMovies.push({ id: doc.id, ...doc.data() });
                });
                renderMovies();
            } catch (error) {
                console.error("Error fetching movies: ", error);
                document.getElementById('moviesGrid').innerHTML = `<div class="no-movies">Failed to load movies from database.</div>`;
            }
        }

        window.renderMovies = function() {
            const grid = document.getElementById('moviesGrid');
            let movies = [...allMovies];

            // Filter by category
            if (currentCategory !== 'All') {
                movies = movies.filter(m => m.category && m.category.toLowerCase() === currentCategory.toLowerCase());
            }

            // Filter by search query
            if (searchQuery.trim() !== '') {
                movies = movies.filter(m => m.title && m.title.toLowerCase().includes(searchQuery.toLowerCase()));
            }

            // Limit to latest 10 movies (Assuming added in order or reverse order)
            const latestMovies = movies.slice(-10).reverse();

            if (latestMovies.length === 0) {
                grid.innerHTML = `<div class="no-movies">No movies found!</div>`;
                return;
            }

            grid.innerHTML = latestMovies.map(movie => `
                <div class="movie-card">
                    <img src="${movie.poster}" alt="${movie.title}" class="movie-poster" onerror="this.src='https://via.placeholder.com/200x280/222/fff?text=No+Image'">
                    <div class="movie-info">
                        <div>
                            <div class="movie-title" title="${movie.title}">${movie.title}</div>
                            <span class="movie-category">${movie.category}</span>
                        </div>
                        <a href="${movie.link}" target="_blank" class="download-btn">Download Now</a>
                    </div>
                </div>
            `).join('');
        }

        // Event listeners after DOM load
        document.addEventListener('DOMContentLoaded', () => {
            fetchMoviesFromFirebase();

            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentCategory = e.target.getAttribute('data-category');
                    renderMovies();
                });
            });

            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderMovies();
            });
        });
    </script>

    <style>
        :root {
            --primary-color: #e50914;
            --bg-color: #141414;
            --card-bg: #1f1f1f;
            --text-color: #ffffff;
            --text-muted: #b3b3b3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: rgba(20, 20, 20, 0.95);
            padding: 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            border-bottom: 2px solid #222;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-area {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary-color);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .search-bar {
            width: 100%;
            max-width: 600px;
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid #333;
            background-color: #262626;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .search-bar:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.3);
        }

        .ad-banner {
            width: 100%;
            max-width: 728px;
            height: 90px;
            background-color: #222;
            border: 1px dashed #444;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 14px;
            margin: 15px auto 0 auto;
            border-radius: 6px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
            flex: 1;
            width: 100%;
        }

        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 15px;
            margin-bottom: 25px;
            scrollbar-width: thin;
        }

        .category-btn {
            background-color: #262626;
            color: var(--text-color);
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            transition: 0.2s;
        }

        .category-btn:hover, .category-btn.active {
            background-color: var(--primary-color);
            font-weight: 600;
        }

        .section-title {
            font-size: 22px;
            margin-bottom: 20px;
            font-weight: 600;
            border-left: 4px solid var(--primary-color);
            padding-left: 10px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(229, 9, 20, 0.2);
        }

        .movie-poster {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background-color: #2b2b2b;
        }

        .movie-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            justify-content: space-between;
        }

        .movie-title {
            font-size: 16px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .movie-category {
            font-size: 12px;
            color: var(--text-muted);
            background: #2a2a2a;
            padding: 2px 8px;
            border-radius: 4px;
            width: fit-content;
        }

        .download-btn {
            display: block;
            text-align: center;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 8px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
            margin-top: 5px;
        }

        .download-btn:hover {
            opacity: 0.9;
        }

        .no-movies {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 16px;
        }

        footer {
            background-color: #0d0d0d;
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 14px;
            border-top: 1px solid #222;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area" id="brandTitle">CineBox</div>
        <input type="text" id="searchInput" class="search-bar" placeholder="Search movies by title...">
        <div class="ad-banner">Advertisement Space (728x90)</div>
    </header>

    <div class="container">
        <div class="categories" id="categoryContainer">
            <button class="category-btn active" data-category="All">All</button>
            <button class="category-btn" data-category="Action">Action</button>
            <button class="category-btn" data-category="Comedy">Comedy</button>
            <button class="category-btn" data-category="Horror">Horror</button>
            <button class="category-btn" data-category="Romance">Romance</button>
            <button class="category-btn" data-category="Sci-Fi">Sci-Fi</button>
        </div>

        <div class="section-title">Latest 10 Movies</div>
        <div class="movies-grid" id="moviesGrid">
            <!-- Loading from Firebase -->
            <div class="no-movies">Loading movies...</div>
        </div>
    </div>

    <footer>
        &copy; 2026 CineBox. All Rights Reserved.
    </footer>
</body>
</html>
