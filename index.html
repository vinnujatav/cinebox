<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">CineBox - Movie Download Hub</title>
    <link id="siteFavicon" rel="icon" type="image/x-icon" href="">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCdrs9-P25DinXf0RZc0mqQeBiu5Gk4l2M",
            authDomain: "cinebox-9011f.firebaseapp.com",
            projectId: "cinebox-9011f",
            storageBucket: "cinebox-9011f.firebasestorage.app",
            messagingSenderId: "134449166678",
            appId: "1:134449166678:web:6370c97d19b27c48a83ef7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadSiteSettings() {
            try {
                const configDoc = await getDoc(doc(db, "settings", "general"));
                if (configDoc.exists()) {
                    const data = configDoc.data();
                    if (data.siteTitle) {
                        document.getElementById('brandTitle').innerText = data.siteTitle;
                        document.getElementById('pageTitle').innerText = data.siteTitle;
                    }
                    if (data.themeColor) { document.documentElement.style.setProperty('--primary-color', data.themeColor); }
                    if (data.iconUrl) { document.getElementById('siteFavicon').href = data.iconUrl; }
                    if (data.footerText) { document.getElementById('footerText').innerText = data.footerText; }
                    if (data.fontStyle) { document.documentElement.style.setProperty('--font-family', data.fontStyle); }

                    // Render Home Page Header Background (Image or Video)
                    if (data.headerHomeEnable && data.homeHeaderMedia) {
                        const bgContainer = document.getElementById('headerBgMedia');
                        if (data.homeHeaderMedia.includes('data:video') || data.homeHeaderMedia.endsWith('.mp4') || data.homeHeaderMedia.includes('video')) {
                            bgContainer.innerHTML = `<video src="${data.homeHeaderMedia}" autoplay muted loop playsinline style="width:100%; height:100%; object-fit:cover; position:absolute; top:0; left:0; z-index:1; opacity:0.6;"></video>`;
                        } else {
                            bgContainer.innerHTML = `<img src="${data.homeHeaderMedia}" alt="Header BG" style="width:100%; height:100%; object-fit:cover; position:absolute; top:0; left:0; z-index:1; opacity:0.6;">`;
                        }
                    }

                    // Render Footer 5 Social Icons & Links
                    if(data.socials && Array.isArray(data.socials)) {
                        const socialContainer = document.getElementById('footerSocialIcons');
                        let iconsHTML = data.socials.map(s => {
                            if(!s.icon) return '';
                            return `<a href="${s.link || '#'}" target="_blank" style="display:inline-block;"><img src="${s.icon}" style="width:32px; height:32px; object-fit:contain; border-radius:50%;"></a>`;
                        }).join('');
                        socialContainer.innerHTML = iconsHTML;
                    }
                }

                const adDoc = await getDoc(doc(db, "settings", "advancedAds"));
                if (adDoc.exists()) {
                    const ads = adDoc.data();
                    renderAd('topAdContainer', ads.topMedia, ads.topLink, ads.topHeight, ads.topWidth, ads.topEnable);
                    renderAd('middleAdContainer', ads.middleMedia, ads.middleLink, ads.middleHeight, ads.middleWidth, ads.middleEnable);
                    renderAd('bottomAdContainer', ads.bottomMedia, ads.bottomLink, ads.bottomHeight, ads.bottomWidth, ads.bottomEnable);
                }
            } catch (e) { console.error("Settings load error:", e); }
        }

        function renderAd(containerId, media, link, height, width, enable) {
            const container = document.getElementById(containerId);
            if (!container) return;
            if (enable && media) {
                let content = '';
                const hStyle = height ? `height:${height};` : 'height:auto;';
                const wStyle = width ? `width:${width};` : 'width:100%;';
                
                if (media.includes('data:video') || media.endsWith('.mp4') || media.includes('video')) {
                    content = `<video src="${media}" autoplay muted loop playsinline style="${hStyle} ${wStyle} object-fit:cover; display:block;"></video>`;
                } else {
                    content = `<img src="${media}" alt="Ad" style="${hStyle} ${wStyle} object-fit:cover; display:block;">`;
                }

                container.innerHTML = `<a href="${link || '#'}" target="_blank" style="display:block;">${content}</a>`;
                container.style.display = 'block';
            } else {
                container.style.display = 'none';
            }
        }

        let allMovies = [];
        let currentCategory = 'All';
        let searchQuery = '';

        async function fetchMoviesFromFirebase() {
            try {
                const querySnapshot = await getDocs(collection(db, "movies"));
                allMovies = [];
                querySnapshot.forEach((doc) => {
                    allMovies.push({ id: doc.id, ...doc.data() });
                });
                renderMovies();
            } catch (error) {
                document.getElementById('moviesGrid').innerHTML = `<div class="no-movies">Failed to load movies.</div>`;
            }
        }

        window.renderMovies = function() {
            const grid = document.getElementById('moviesGrid');
            let movies = [...allMovies];

            if (currentCategory !== 'All') {
                movies = movies.filter(m => m.category && m.category.toLowerCase().includes(currentCategory.toLowerCase()));
            }

            if (searchQuery.trim() !== '') {
                movies = movies.filter(m => m.title && m.title.toLowerCase().includes(searchQuery.toLowerCase()));
            }

            // Sort: Featured/Latest (isFeatured == true) first, then by newest timestamp
            movies.sort((a, b) => {
                if (a.isFeatured && !b.isFeatured) return -1;
                if (!a.isFeatured && b.isFeatured) return 1;
                return (b.createdAt || 0) - (a.createdAt || 0);
            });

            const latestMovies = movies.slice(0, 10);

            if (latestMovies.length === 0) {
                grid.innerHTML = `<div class="no-movies">No movies found!</div>`;
                return;
            }

            grid.innerHTML = latestMovies.map(movie => `
                <div class="movie-card" onclick="window.location.href='movie.html?id=${movie.id}'">
                    <img src="${movie.poster}" alt="${movie.title}" class="movie-poster" onerror="this.src='https://via.placeholder.com/150x220/222/fff?text=No+Image'">
                    <div class="movie-info">
                        <div>
                            <div class="movie-title" title="${movie.title}">${movie.title}</div>
                            <div class="movie-meta">
                                <span>${movie.year || '2026'}</span> • <span>${movie.language || 'Hindi'}</span>
                            </div>
                            <span class="movie-category">${movie.category ? movie.category.split(',')[0] : 'Movie'}</span>
                        </div>
                        <span class="download-btn">View Details</span>
                    </div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadSiteSettings();
            fetchMoviesFromFirebase();

            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentCategory = e.target.getAttribute('data-category');
                    renderMovies();
                });
            });

            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderMovies();
            });
        });
    </script>

    <style>
        :root {
            --primary-color: #e50914;
            --bg-color: #141414;
            --card-bg: #1f1f1f;
            --text-color: #ffffff;
            --text-muted: #b3b3b3;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-family); }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; }
        
        header { 
            background-color: #141414; 
            padding: 15px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 12px; 
            border-bottom: 2px solid #222; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            overflow: hidden;
            position: relative;
        }
        .logo-area { 
            font-size: 28px; 
            font-weight: 800; 
            color: var(--primary-color); 
            letter-spacing: 1px; 
            text-transform: uppercase; 
            position: relative; 
            z-index: 2; 
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        }
        .search-bar { width: 100%; max-width: 500px; padding: 10px 18px; border-radius: 25px; border: 1px solid #333; background-color: #262626; color: white; font-size: 15px; outline: none; position: relative; z-index: 2; }
        
        .ad-banner { width: 100%; max-width: 728px; background-color: transparent; display: none; align-items: center; justify-content: center; margin: 10px auto; border-radius: 6px; overflow: hidden; text-align: center; border: none !important; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px 12px; flex: 1; width: 100%; }
        .categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; }
        .category-btn { background-color: #262626; color: var(--text-color); border: none; padding: 6px 14px; border-radius: 15px; cursor: pointer; font-size: 13px; white-space: nowrap; }
        .category-btn:hover, .category-btn.active { background-color: var(--primary-color); font-weight: 600; }
        .section-title { font-size: 18px; margin-bottom: 15px; font-weight: 600; border-left: 4px solid var(--primary-color); padding-left: 8px; }
        .movies-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .movie-card { background-color: var(--card-bg); border-radius: 6px; overflow: hidden; box-shadow: 0 3px 8px rgba(0,0,0,0.3); display: flex; flex-direction: column; cursor: pointer; transition: transform 0.2s; }
        .movie-card:hover { transform: translateY(-3px); }
        .movie-poster { width: 100%; height: 190px; object-fit: cover; background-color: #2b2b2b; }
        .movie-info { padding: 10px; display: flex; flex-direction: column; gap: 6px; flex: 1; justify-content: space-between; }
        .movie-title { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .movie-meta { font-size: 11px; color: var(--text-muted); }
        .movie-category { font-size: 10px; color: var(--text-muted); background: #2a2a2a; padding: 2px 6px; border-radius: 3px; width: fit-content; margin-top: 2px; }
        .download-btn { display: block; text-align: center; background-color: var(--primary-color); color: white; text-decoration: none; padding: 6px; border-radius: 4px; font-size: 12px; font-weight: 600; margin-top: 4px; }
        .no-movies { grid-column: 1 / -1; text-align: center; padding: 30px; color: var(--text-muted); font-size: 14px; }
        
        footer { background-color: #0d0d0d; text-align: center; padding: 15px; color: var(--text-muted); font-size: 13px; border-top: 1px solid #222; margin-top: auto; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .footer-socials { display: flex; gap: 15px; justify-content: center; align-items: center; margin-bottom: 5px; }
    </style>
</head>
<body>

    <header>
        <div id="headerBgMedia" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></div>
        <div class="logo-area" id="brandTitle">CineBox</div>
        <input type="text" id="searchInput" class="search-bar" placeholder="Search movies...">
        <div class="ad-banner" id="topAdContainer" style="position:relative; z-index:2;"></div>
    </header>

    <div class="container">
        <div class="categories" id="categoryContainer">
            <button class="category-btn active" data-category="All">All</button>
            <button class="category-btn" data-category="Action">Action</button>
            <button class="category-btn" data-category="Comedy">Comedy</button>
            <button class="category-btn" data-category="Horror">Horror</button>
            <button class="category-btn" data-category="Romance">Romance</button>
            <button class="category-btn" data-category="Sci-Fi">Sci-Fi</button>
        </div>

        <div class="ad-banner" id="middleAdContainer"></div>

        <div class="section-title">Latest 10 Movies</div>
        <div class="movies-grid" id="moviesGrid">
            <div class="no-movies">Loading movies...</div>
        </div>

        <div class="ad-banner" id="bottomAdContainer" style="margin-top: 20px;"></div>
    </div>

    <footer>
        <div class="footer-socials" id="footerSocialIcons"></div>
        <span id="footerText">&copy; 2026 CineBox. All Rights Reserved.</span>
    </footer>
</body>
</html>
