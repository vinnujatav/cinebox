<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CineBox - Movies</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#0b0b0f;
  color:white;
}

/* HEADER */

header{
  padding:16px 20px;
  background:#14141c;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:25px;
  font-weight:bold;
  white-space:nowrap;
}

.search-box{
  position:relative;
  width:45%;
}

.search{
  width:100%;
  padding:12px 45px 12px 16px;
  border-radius:25px;
  border:none;
  outline:none;
  font-size:15px;
}

.clear-search{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  border:none;
  background:none;
  color:#777;
  font-size:20px;
  cursor:pointer;
  display:none;
}

/* HERO */

.hero{
  padding:55px 20px;
  text-align:center;
  background:linear-gradient(135deg,#191927,#09090c);
}

.hero h1{
  font-size:38px;
  margin-bottom:12px;
}

.hero p{
  color:#bbb;
}

/* CONTAINER */

.container{
  padding:25px;
  max-width:1200px;
  margin:auto;
}

/* ADS */

.ad{
  margin:25px 0;
  min-height:90px;
  border:1px dashed #444;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
}

/* CATEGORIES */

.categories{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.category{
  border:1px solid #333;
  background:#171720;
  color:white;
  padding:9px 15px;
  border-radius:20px;
  cursor:pointer;
}

.category:hover,
.category.active{
  background:#e50914;
  border-color:#e50914;
}

/* TITLE */

.section-title{
  margin-bottom:20px;
  font-size:24px;
}

/* MOVIES */

.movies{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:18px;
}

.movie{
  background:#16161f;
  border-radius:12px;
  overflow:hidden;
  transition:.2s;
}

.movie:hover{
  transform:translateY(-4px);
}

.movie img{
  width:100%;
  height:240px;
  object-fit:cover;
  display:block;
}

.movie-info{
  padding:13px;
}

.movie-info h3{
  margin-bottom:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.movie-info p{
  color:#aaa;
  font-size:14px;
  margin-bottom:12px;
}

.btn{
  display:block;
  text-align:center;
  text-decoration:none;
  padding:10px;
  border-radius:7px;
  background:#e50914;
  color:white;
  font-weight:bold;
  cursor:pointer;
  border:0;
  width:100%;
}

/* LOADING */

.loading{
  text-align:center;
  padding:40px;
  color:#aaa;
  grid-column:1/-1;
}

/* NO RESULT */

.no-results{
  text-align:center;
  padding:40px 20px;
  color:#aaa;
  display:none;
  grid-column:1/-1;
}

.no-results h3{
  color:white;
  margin-bottom:8px;
}

/* POPUP */

.modal{
  display:none;
  position:fixed;
  z-index:100;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.85);
  padding:20px;
  overflow:auto;
}

.modal-content{
  max-width:500px;
  margin:5% auto;
  background:#181820;
  border-radius:15px;
  overflow:hidden;
  position:relative;
}

.modal-content img{
  width:100%;
  height:300px;
  object-fit:cover;
}

.modal-info{
  padding:20px;
}

.modal-info h2{
  margin-bottom:10px;
}

.modal-info p{
  color:#bbb;
  line-height:1.6;
  margin-bottom:15px;
}

.close{
  position:absolute;
  right:15px;
  top:10px;
  font-size:30px;
  cursor:pointer;
  background:rgba(0,0,0,.6);
  width:40px;
  height:40px;
  text-align:center;
  border-radius:50%;
}

.download{
  margin-top:10px;
}

/* FOOTER */

footer{
  margin-top:40px;
  padding:25px;
  text-align:center;
  background:#14141c;
  color:#888;
}

/* MOBILE */

@media(max-width:600px){

  header{
    flex-direction:column;
  }

  .logo{
    width:100%;
    text-align:center;
  }

  .search-box{
    width:100%;
  }

  .hero h1{
    font-size:30px;
  }

  .movies{
    grid-template-columns:repeat(2,1fr);
  }

  .movie img{
    height:210px;
  }

  .container{
    padding:18px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    🎬 CineBox
  </div>

  <div class="search-box">

    <input
      type="text"
      class="search"
      id="search"
      placeholder="Search movies..."
      autocomplete="off"
    >

    <button
      class="clear-search"
      id="clearSearch"
      onclick="clearSearch()"
    >
      ×
    </button>

  </div>

</header>


<section class="hero">

  <h1>Welcome to CineBox</h1>

  <p>
    Discover your favorite movies
  </p>

</section>


<div class="container">

  <div class="ad">
    Advertisement
  </div>


  <!-- CATEGORIES -->

  <div class="categories">

    <button
      class="category active"
      onclick="filterCategory('All',this)"
    >
      All
    </button>

    <button
      class="category"
      onclick="filterCategory('Action',this)"
    >
      Action
    </button>

    <button
      class="category"
      onclick="filterCategory('Comedy',this)"
    >
      Comedy
    </button>

    <button
      class="category"
      onclick="filterCategory('Drama',this)"
    >
      Drama
    </button>

  </div>


  <h2 class="section-title">
    Latest Movies
  </h2>


  <!-- FIREBASE MOVIES -->

  <div
    class="movies"
    id="movies"
  >

    <div class="loading" id="loading">
      Loading movies...
    </div>

    <div
      class="no-results"
      id="noResults"
    >

      <h3>No movies found</h3>

      <p>
        Try another movie name or category.
      </p>

    </div>

  </div>


  <div class="ad">
    Advertisement
  </div>

</div>


<!-- MOVIE DETAILS POPUP -->

<div
  class="modal"
  id="movieModal"
>

  <div class="modal-content">

    <span
      class="close"
      onclick="closeMovie()"
    >
      ×
    </span>

    <img
      id="modalImage"
      src=""
      alt="Movie"
    >

    <div class="modal-info">

      <h2 id="modalTitle"></h2>

      <p id="modalMeta"></p>

      <p id="modalDescription"></p>

      <!-- ONLY DOWNLOAD -->

      <a
        id="downloadButton"
        class="btn download"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        📥 Download
      </a>

    </div>

  </div>

</div>


<footer>

  © 2026 CineBox • All Rights Reserved

</footer>


<!-- FIREBASE -->

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy,
  limit
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ==================================================
   IMPORTANT:
   YAHAN APNE ADMIN PANEL WALA SAME FIREBASE CONFIG
   PASTE KARO
   ================================================== */

const firebaseConfig = {

  apiKey: "AIzaSyCdrs9-P25DinXf0RZc0mqQeBiu5Gk4l2M",

  authDomain: "cinebox-9011f.firebaseapp.com",

  projectId: "cinebox-9011f",

  storageBucket: "cinebox-9011f.firebasestorage.app",

  messagingSenderId: "134449166678",

  appId: "1:134449166678:web:6370c97d19b27c48a83ef7"

};


/* FIREBASE START */

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* GLOBAL DATA */

let allMovies = [];

let currentCategory = "All";



/* ==================================================
   LOAD LATEST 10 MOVIES
   ================================================== */

async function loadMovies(){

  const moviesContainer =
    document.getElementById("movies");

  const loading =
    document.getElementById("loading");

  const noResults =
    document.getElementById("noResults");


  try{

    loading.style.display = "block";

    noResults.style.display = "none";


    /*
      createdAt ke according se newest movies
      pehle aayengi aur maximum 10 movies load hongi.
    */

    const moviesQuery = query(

      collection(db,"movies"),

      orderBy("createdAt","desc"),

      limit(10)

    );


    const snapshot =
      await getDocs(moviesQuery);


    allMovies = [];


    snapshot.forEach((doc) => {

      allMovies.push({

        id:doc.id,

        ...doc.data()

      });

    });


    loading.style.display = "none";


    renderMovies();


  }catch(error){

    console.error("Firebase Error:",error);

    loading.style.display = "none";

    moviesContainer.innerHTML = `

      <div class="loading">

        ❌ Movies load nahi ho rahi.

        <br><br>

        Firebase configuration ya Firestore
        rules check karo.

      </div>

    `;

  }

}



/* ==================================================
   RENDER MOVIES
   ================================================== */

function renderMovies(){

  const moviesContainer =
    document.getElementById("movies");

  const noResults =
    document.getElementById("noResults");


  /*
    Purane cards remove
  */

  moviesContainer
    .querySelectorAll(".movie")
    .forEach(movie => movie.remove());


  const searchValue =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  let filteredMovies =
    allMovies.filter(movie => {


      /*
        Category
      */

      const category =
        String(
          movie.genre ||
          movie.category ||
          ""
        );


      const categoryMatch =
        currentCategory === "All" ||
        category.toLowerCase()
          .includes(
            currentCategory.toLowerCase()
          );


      /*
        Search
      */

      const searchableText = [

        movie.title,

        movie.name,

        movie.genre,

        movie.category,

        movie.year,

        movie.language,

        movie.quality,

        movie.description

      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();


      const searchMatch =
        searchableText.includes(searchValue);


      return categoryMatch && searchMatch;

    });


  if(filteredMovies.length === 0){

    noResults.style.display = "block";

    return;

  }


  noResults.style.display = "none";


  filteredMovies.forEach(movie => {

    const card =
      createMovieCard(movie);

    moviesContainer.appendChild(card);

  });

}



/* ==================================================
   CREATE MOVIE CARD
   ================================================== */

function createMovieCard(movie){

  const card =
    document.createElement("div");

  card.className = "movie";


  const title =
    movie.title ||
    movie.name ||
    "Untitled Movie";


  const poster =
    movie.poster ||
    movie.posterUrl ||
    movie.image ||
    "https://via.placeholder.com/300x450?text=CineBox";


  const year =
    movie.year ||
    "";


  const genre =
    movie.genre ||
    movie.category ||
    "";


  const language =
    movie.language ||
    "";


  const quality =
    movie.quality ||
    "";


  /*
    Meta text
  */

  const metaParts = [

    year,

    genre,

    language,

    quality

  ].filter(Boolean);


  const meta =
    metaParts.join(" • ");


  card.innerHTML = `

    <img
      src="${escapeHTML(poster)}"
      alt="${escapeHTML(title)}"
      loading="lazy"
      onerror="this.src='https://via.placeholder.com/300x450?text=CineBox'"
    >

    <div class="movie-info">

      <h3>
        ${escapeHTML(title)}
      </h3>

      <p>
        ${escapeHTML(meta || "Movie")}
      </p>

      <button
        class="btn"
        type="button"
      >
        View Details
      </button>

    </div>

  `;


  /*
    Details button
  */

  const button =
    card.querySelector("button");


  button.addEventListener(
    "click",
    () => {

      openMovie(movie);

    }
  );


  return card;

}



/* ==================================================
   OPEN MOVIE
   ================================================== */

function openMovie(movie){

  const title =
    movie.title ||
    movie.name ||
    "Untitled Movie";


  const poster =
    movie.poster ||
    movie.posterUrl ||
    movie.image ||
    "https://via.placeholder.com/300x450?text=CineBox";


  const meta = [

    movie.year,

    movie.genre || movie.category,

    movie.language,

    movie.quality

  ]
  .filter(Boolean)
  .join(" • ");


  const description =
    movie.description ||
    "No description available.";


  const downloadUrl =
    movie.downloadUrl ||
    movie.downloadURL ||
    movie.download ||
    "#";


  document.getElementById(
    "modalTitle"
  ).innerText = title;


  document.getElementById(
    "modalImage"
  ).src = poster;


  document.getElementById(
    "modalMeta"
  ).innerText = meta;


  document.getElementById(
    "modalDescription"
  ).innerText = description;


  const downloadButton =
    document.getElementById(
      "downloadButton"
    );


  if(downloadUrl && downloadUrl !== "#"){

    downloadButton.href =
      downloadUrl;

    downloadButton.style.display =
      "block";

  }else{

    downloadButton.removeAttribute("href");

    downloadButton.style.display =
      "none";

  }


  document.getElementById(
    "movieModal"
  ).style.display = "block";

}



/* ==================================================
   CLOSE MOVIE
   ================================================== */

window.closeMovie = function(){

  document.getElementById(
    "movieModal"
  ).style.display = "none";

};



/* ==================================================
   CATEGORY FILTER
   ================================================== */

window.filterCategory =
function(category,button){

  currentCategory =
    category;


  document
    .querySelectorAll(".category")
    .forEach(btn => {

      btn.classList.remove("active");

    });


  button.classList.add("active");


  renderMovies();

};



/* ==================================================
   SEARCH
   ================================================== */

const searchInput =
  document.getElementById("search");


searchInput.addEventListener(
  "input",
  function(){

    updateClearButton();

    renderMovies();

  }
);



/* ENTER KEY */

searchInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      renderMovies();

    }

  }
);



/* CLEAR SEARCH */

window.clearSearch =
function(){

  searchInput.value = "";

  updateClearButton();

  renderMovies();

  searchInput.focus();

};



function updateClearButton(){

  const clearButton =
    document.getElementById(
      "clearSearch"
    );


  if(searchInput.value.trim()){

    clearButton.style.display =
      "block";

  }else{

    clearButton.style.display =
      "none";

  }

}



/* ==================================================
   CLOSE MODAL WHEN OUTSIDE CLICK
   ================================================== */

window.addEventListener(
  "click",
  function(event){

    const modal =
      document.getElementById(
        "movieModal"
      );


    if(event.target === modal){

      closeMovie();

    }

  }
);



/* ==================================================
   ESCAPE HTML
   ================================================== */

function escapeHTML(value){

  return String(value)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}



/* ==================================================
   START
   ================================================== */

loadMovies();

</script>

</body>
</html>
