<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineBox - Movies</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
    }

    header {
      padding: 18px;
      background: #14141c;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .search {
      width: 45%;
      padding: 11px 15px;
      border-radius: 25px;
      border: none;
      outline: none;
    }

    .hero {
      padding: 55px 20px;
      text-align: center;
      background: linear-gradient(135deg, #191927, #09090c);
    }

    .hero h1 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #bbb;
    }

    .container {
      padding: 25px;
      max-width: 1200px;
      margin: auto;
    }

    .section-title {
      margin-bottom: 20px;
      font-size: 24px;
    }

    .movies {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 18px;
    }

    .movie {
      background: #16161f;
      border-radius: 12px;
      overflow: hidden;
      transition: 0.2s;
    }

    .movie:hover {
      transform: translateY(-4px);
    }

    .movie img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
    }

    .movie-info {
      padding: 13px;
    }

    .movie-info h3 {
      margin-bottom: 6px;
    }

    .movie-info p {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .btn {
      display: block;
      text-align: center;
      text-decoration: none;
      padding: 10px;
      border-radius: 7px;
      background: #e50914;
      color: white;
      font-weight: bold;
    }

    .ad {
      margin: 25px 0;
      min-height: 90px;
      border: 1px dashed #444;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
    }

    footer {
      margin-top: 40px;
      padding: 25px;
      text-align: center;
      background: #14141c;
      color: #888;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
      }

      .search {
        width: 100%;
      }

      .hero h1 {
        font-size: 30px;
      }

      .movies {
        grid-template-columns: repeat(2, 1fr);
      }

      .movie img {
        height: 210px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">🎬 CineBox</div>
  <input
    type="text"
    class="search"
    id="search"
    placeholder="Search movies..."
  >
</header>

<section class="hero">
  <h1>Welcome to CineBox</h1>
  <p>Watch and discover your favorite movies</p>
</section>

<div class="container">

  <!-- Google AdSense placeholder -->
  <div class="ad">
    Advertisement
  </div>

  <h2 class="section-title">Latest Movies</h2>

  <div class="movies" id="movies">

    <div class="movie">
      <img src="https://via.placeholder.com/300x450?text=Movie+1" alt="Movie 1">
      <div class="movie-info">
        <h3>My Movie 1</h3>
        <p>2026 • Action</p>
        <a href="#" class="btn">Watch / Download</a>
      </div>
    </div>

    <div class="movie">
      <img src="https://via.placeholder.com/300x450?text=Movie+2" alt="Movie 2">
      <div class="movie-info">
        <h3>My Movie 2</h3>
        <p>2026 • Comedy</p>
        <a href="#" class="btn">Watch / Download</a>
      </div>
    </div>

    <div class="movie">
      <img src="https://via.placeholder.com/300x450?text=Movie+3" alt="Movie 3">
      <div class="movie-info">
        <h3>My Movie 3</h3>
        <p>2026 • Drama</p>
        <a href="#" class="btn">Watch / Download</a>
      </div>
    </div>

  </div>

  <div class="ad">
    Advertisement
  </div>

</div>

<footer>
  © 2026 CineBox • All Rights Reserved
</footer>

<script>
  const search = document.getElementById("search");
  const movies = document.querySelectorAll(".movie");

  search.addEventListener("input", function () {
    const value = this.value.toLowerCase();

    movies.forEach(movie => {
      const title = movie.querySelector("h3").innerText.toLowerCase();

      movie.style.display =
        title.includes(value) ? "block" : "none";
    });
  });
</script>

</body>
          </html>
